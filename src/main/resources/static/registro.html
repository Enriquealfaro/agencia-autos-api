<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutosManolo | Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="registro">
  <div id="siteHeader"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-6">
          <section class="card border-0 shadow-sm auth-card">
            <div class="card-body p-4 p-lg-5">
              <div class="mb-4">
                <h1 class="h3 fw-bold mb-2">Crear cuenta</h1>
                <p class="text-secondary mb-0">Registro simple para acceder al panel de nuevos autos.</p>
              </div>

              <form id="registerForm" class="row g-3" novalidate>
                <div class="col-md-6">
                  <label for="firstName" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="firstName" name="firstName" required>
                </div>
                <div class="col-md-6">
                  <label for="lastName" class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="lastName" name="lastName" required>
                </div>
                <div class="col-12">
                  <label for="email" class="form-label">Correo</label>
                  <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-12">
                  <label for="password" class="form-label">Contrasena</label>
                  <input type="password" class="form-control" id="password" name="password" required minlength="4">
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Crear cuenta</button>
                </div>
              </form>

              <div id="registerAlert" class="alert mt-4 d-none" role="alert"></div>

              <p class="text-secondary small mt-4 mb-0">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesion</a>.
              </p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top py-4 mt-auto bg-white">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-secondary">AutosManolo</span>
      <span class="text-secondary">&copy; <span id="currentYear"></span></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/site.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
