<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutosManolo | Catalogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="catalogo">
  <div id="siteHeader"></div>

  <main class="py-5">
    <div class="container">
      <section class="mb-4">
        <h1 class="display-6 fw-bold mb-2">Catalogo de autos</h1>
        <p class="text-secondary mb-0">Inventario disponible con paginacion.</p>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div id="catalogGrid" class="catalog-grid">
            <div class="text-center py-5 text-secondary">Cargando autos...</div>
          </div>
        </div>
      </section>

      <section class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mt-4">
        <div id="pageInfo" class="text-secondary small">Pagina 1 de 1</div>
        <div class="d-flex gap-2">
          <button id="prevPageBtn" class="btn btn-outline-primary" type="button">Anterior</button>
          <button id="nextPageBtn" class="btn btn-outline-primary" type="button">Siguiente</button>
        </div>
      </section>

      <div id="catalogAlert" class="alert alert-danger mt-4 d-none" role="alert">
        No se pudo cargar el catalogo.
      </div>
    </div>
  </main>

  <footer class="border-top py-4 mt-auto bg-white">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-secondary">AutosManolo</span>
      <span class="text-secondary">&copy; <span id="currentYear"></span></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/site.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
