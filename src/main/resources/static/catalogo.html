<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutosManolo | Catalogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="border-bottom bg-white sticky-top">
    <nav class="navbar navbar-expand-lg container py-2" aria-label="Principal">
      <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">AutosManolo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Mostrar menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="catalogo.html">Catalogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="nuevos.html">Nuevos</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <section class="mb-4">
        <h1 class="display-6 fw-bold mb-2">Catalogo de autos</h1>
        <p class="text-secondary mb-0">Inventario disponible con paginacion.</p>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Color</th>
                  <th>Anio</th>
                  <th class="text-end">Precio</th>
                  <th>Transmision</th>
                </tr>
              </thead>
              <tbody id="catalogTableBody">
                <tr>
                  <td colspan="6" class="text-center py-4 text-secondary">Cargando autos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mt-4">
        <div id="pageInfo" class="text-secondary small">Pagina 1 de 1</div>
        <div class="d-flex gap-2">
          <button id="prevPageBtn" class="btn btn-outline-primary" type="button">Anterior</button>
          <button id="nextPageBtn" class="btn btn-outline-primary" type="button">Siguiente</button>
        </div>
      </section>

      <div id="catalogAlert" class="alert alert-danger mt-4 d-none" role="alert">
        No se pudo cargar el catalogo.
      </div>
    </div>
  </main>

  <footer class="border-top py-4 mt-auto bg-white">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-secondary">AutosManolo</span>
      <span class="text-secondary">&copy; <span id="currentYear"></span></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/site.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
