<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutosManolo | Usuarios pendientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="usuariosAdmin">
  <div id="siteHeader"></div>

  <main id="adminUsersPageContent" class="py-5 d-none">
    <div class="container">
      <section class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
        <div>
          <span class="text-uppercase small fw-semibold text-secondary">Administracion</span>
          <h1 class="display-6 fw-bold mb-2">Usuarios pendientes</h1>
          <p class="text-secondary mb-0">Revisa solicitudes de acceso sin mezclar el rol del usuario con su estado operativo.</p>
        </div>
        <span id="pendingUsersCount" class="pending-counter">0 pendientes</span>
      </section>

      <section class="card border-0 shadow-sm pending-panel">
        <div class="card-body p-4">
          <div id="pendingUsersList" class="admin-user-list">
            <div class="text-center py-5 text-secondary">Cargando usuarios pendientes...</div>
          </div>
        </div>
      </section>

      <div id="userAdminAlert" class="alert mt-4 d-none" role="alert"></div>
    </div>
  </main>

  <footer class="border-top py-4 mt-auto bg-white">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-secondary">AutosManolo</span>
      <span class="text-secondary">&copy; <span id="currentYear"></span></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pending-users-panel.js"></script>
  <script src="js/admin-usuarios.js"></script>
</body>
</html>
